version: '3.8'

services:

  # ─── 1. PostgreSQL Database ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ticket-router-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  # ─── 2. Redis Message Broker ──────────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: ticket-router-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  # ─── 3. FastAPI REST API ──────────────────────────────────────────────────
  ticket-router-api:
    build: .
    container_name: ticket-router-api
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── 4. Celery Background Worker ─────────────────────────────────────────
  celery-worker:
    build: .
    container_name: ticket-router-worker
    command: celery -A worker.celery_app worker --loglevel=info
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── 5. CLI Batch Processor ───────────────────────────────────────────────
  ticket-router-cli:
    build: .
    container_name: ticket-router-cli
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
