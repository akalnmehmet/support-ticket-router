version: '3.8'

services:
  ticket-router-cli:
    build: .
    container_name: ticket-router-cli
    volumes:
      - ./data:/app/data

  ticket-router-api:
    build: .
    container_name: ticket-router-api
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
